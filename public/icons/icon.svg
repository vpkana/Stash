<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Stash">
  <!--
    The Stash mark: a kept ribbon.

    One idea, drawn once — a bookmark whose notch is a soft curve rather than a
    sharp V. It says what the app is for (things you mean to keep), it survives
    being 16px wide, and it is a single flat shape, so it needs no second colour,
    no gradient and no shadow to read.

    Geometry is deliberate and worth keeping:
      ribbon   184 × 228 units, centred on (256, 254)
      scale    1.22  ->  the mark fills 54% of the tile, which is the proportion
                       that looks correct both as a rounded launcher tile and
                       inside Android's adaptive-icon safe zone
      corner   40 units at the top, 12 at the bottom tips: soft, but not a pill
      notch    51 units deep (22% of the height) with a curved apex
  -->
  <rect width="512" height="512" rx="116" fill="#1B1A4D" />
  <g transform="translate(256 254) scale(1.22) translate(-256 -254)">
    <path
      d="M 204 140 H 308 Q 348 140 348 180 V 352 Q 348 368 336 368 L 268 322 Q 256 317 244 322 L 176 368 Q 164 368 164 352 V 180 Q 164 140 204 140 Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
