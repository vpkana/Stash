<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Stash">
  <!--
    The maskable icon: the same mark, on a background that bleeds to every edge.

    Android and the PWA mask this one themselves, so there is no rounded tile here
    and the mark is pulled in to 1.0 of its tile scale: everything important sits
    inside the middle 80% circle, which is the region a circular, squircle or
    teardrop mask is guaranteed to keep.
  -->
  <rect width="512" height="512" fill="#1B1A4D" />
  <g transform="translate(256 254) scale(1.0) translate(-256 -254)">
    <path
      d="M 204 140 H 308 Q 348 140 348 180 V 352 Q 348 368 336 368 L 268 322 Q 256 317 244 322 L 176 368 Q 164 368 164 352 V 180 Q 164 140 204 140 Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
