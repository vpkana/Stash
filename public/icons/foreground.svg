<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!--
    The Android adaptive-icon foreground.

    Android draws the background full-bleed and masks the result, so this file is
    only the mark: no tile, no background, transparent everywhere else.

    The canvas is 108 units and the region guaranteed to survive any launcher
    mask is a circle 66 units across, centred. The mark is therefore drawn inside
    that circle rather than merely inside the square, at 40% of the canvas —
    which is the proportion Google's own adaptive icons use.
  -->
